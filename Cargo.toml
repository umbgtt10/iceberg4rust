[workspace]
members = ["core", "cli", "xtask"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
authors = ["Umberto Gotti <umberto.gotti@umbertogotti.dev>"]
license = "MIT"
repository = "https://github.com/umbgtt10/iceberg4rust"

[workspace.dependencies]
anyhow = "1.0.98"
cargo_metadata = "0.23.1"
clap = { version = "4.6.0", features = ["derive"] }
iceberg4rust-core = { path = "core", version = "0.3.1" }
libm = "0.2.16"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0.117", features = ["full", "visit"] }
tempfile = "3"
walkdir = "2.5.0"

# Every member and every target: no `unsafe` anywhere in the workspace. core
# says so at its crate root as well.
[workspace.lints.rust]
unsafe_code = "forbid"

# A dependency cargo-shear cannot see used, each with its reason. Stage 2
# refuses an ignored entry that has none.
[workspace.metadata.cargo-shear]
ignored = ["proc-macro2"]
reasons = { proc-macro2 = "declared for its span-locations feature: core reads line numbers from syn's spans, which only that feature gives them; no file imports it" }
