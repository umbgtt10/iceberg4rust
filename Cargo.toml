[package]
name = "cargo-iceberg4rust"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
authors = ["Umberto Gotti <umberto.gotti@umbertogotti.dev>"]
description = "Cargo subcommand that measures how much private implementation a Rust source file hides beneath its public surface"
license = "MIT"
readme = "README.md"
repository = "https://github.com/umbgtt10/iceberg4rust"
documentation = "https://docs.rs/cargo-iceberg4rust"
keywords = ["cargo", "subcommand", "metrics", "complexity", "cli"]
categories = ["development-tools::cargo-plugins", "development-tools", "command-line-utilities"]

autotests = false

[lib]
name = "iceberg4rust"

[[bin]]
name = "cargo-iceberg4rust"
path = "src/main.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

[dependencies]
anyhow = "1.0.98"
cargo_metadata = "0.23.1"
clap = { version = "4.6.0", features = ["derive"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0.117", features = ["full", "visit"] }
walkdir = "2.5.0"

[dev-dependencies]
clap = { version = "4.6.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0.117", features = ["full", "visit"] }
